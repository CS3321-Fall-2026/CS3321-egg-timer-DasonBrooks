[project]
name = "egg-timer"
version = "0.1.0"
description = "A simple egg timer API: start, check, and stop timers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/egg_timer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
